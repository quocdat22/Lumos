[project]
name = "lumos"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "quocdat22", email = "hoanglequocdat132002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.7.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
lumos = "lumos.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
